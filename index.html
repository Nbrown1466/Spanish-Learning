<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf8f3">
  <title>HTML Tag Flashcards</title>
  <style>
    :root {
      --paper: #faf8f3;
      --ink: #25231f;
      --muted: #716d64;
      --line: #ded8cc;
      --blue: #b9dafa;
      --blue-dark: #245f8f;
      --green: #cce8d0;
      --green-dark: #2c6b42;
      --rose: #f3c9d0;
      --rose-dark: #934251;
      --yellow: #f4e0a8;
      --shadow: 0 20px 50px rgba(72, 62, 48, .13), 0 3px 10px rgba(72, 62, 48, .08);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 10% 12%, rgba(185, 218, 250, .38), transparent 25rem),
        radial-gradient(circle at 90% 82%, rgba(244, 224, 168, .38), transparent 24rem),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }

    .page {
      width: min(100% - 32px, 980px);
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--blue-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(30px, 6vw, 50px); letter-spacing: -.04em; line-height: 1; }
    .subtitle { margin: 10px 0 0; color: var(--muted); line-height: 1.5; }
    .header-links { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .tree-link {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.72);
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
      text-decoration: none;
      white-space: nowrap;
    }
    .tree-link.primary { border-color: transparent; background: var(--blue); color: #174d77; }

    .study-shell {
      padding: clamp(16px, 3vw, 28px);
      border: 1px solid rgba(110, 99, 82, .15);
      border-radius: 28px;
      background: rgba(255, 255, 255, .58);
      box-shadow: 0 12px 45px rgba(79, 68, 50, .07);
      backdrop-filter: blur(12px);
    }

    .toolbar, .stats, .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .stats { justify-content: flex-start; flex-wrap: wrap; }
    .pill {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .pill b { color: var(--ink); }
    .pill.know b { color: var(--green-dark); }
    .pill.learning b { color: var(--rose-dark); }

    .icon-button {
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      color: var(--ink);
      cursor: pointer;
      font-weight: 750;
    }
    .icon-button:hover { border-color: #aaa297; transform: translateY(-1px); }
    .icon-button:focus-visible, .choice:focus-visible, .flashcard:focus-visible { outline: 3px solid rgba(36, 95, 143, .32); outline-offset: 3px; }

    .progress-track {
      height: 8px;
      margin: 18px 0 24px;
      overflow: hidden;
      border-radius: 99px;
      background: #e9e4da;
    }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: var(--blue-dark); transition: width .35s ease; }

    .card-stage {
      position: relative;
      height: clamp(340px, 54vw, 440px);
      perspective: 1200px;
      touch-action: pan-y;
    }

    .flashcard {
      position: absolute;
      inset: 0;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 24px;
      background: transparent;
      box-shadow: var(--shadow);
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.2,.75,.2,1), opacity .28s ease;
      user-select: none;
    }

    .flashcard.is-flipped { transform: rotateY(180deg); }
    .flashcard.dragging { transition: none; }
    .flashcard.exit-left { transform: translateX(-125%) rotate(-13deg); opacity: 0; }
    .flashcard.exit-right { transform: translateX(125%) rotate(13deg); opacity: 0; }
    .flashcard.is-flipped.exit-left { transform: translateX(-125%) rotateY(180deg) rotate(-13deg); opacity: 0; }
    .flashcard.is-flipped.exit-right { transform: translateX(125%) rotateY(180deg) rotate(13deg); opacity: 0; }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(26px, 7vw, 64px);
      overflow: hidden;
      border: 2px solid rgba(70, 65, 57, .12);
      border-radius: inherit;
      backface-visibility: hidden;
    }
    .front { background: linear-gradient(145deg, #fff, #f9f6ef); }
    .back { background: linear-gradient(145deg, #eaf5ff, #d8eaf9); transform: rotateY(180deg); }

    .side-label {
      position: absolute;
      top: 22px;
      left: 24px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .term { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: clamp(45px, 10vw, 88px); font-weight: 800; letter-spacing: -.06em; }
    .definition { max-width: 680px; font-size: clamp(23px, 4vw, 38px); font-weight: 760; line-height: 1.2; text-align: center; }
    .example { margin-top: 24px; color: #425a6e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: clamp(14px, 2.5vw, 19px); text-align: center; }
    .tap-hint { position: absolute; bottom: 20px; color: var(--muted); font-size: 13px; }

    .drag-label {
      position: absolute;
      z-index: 4;
      top: 26px;
      padding: 9px 13px;
      border: 3px solid currentColor;
      border-radius: 11px;
      background: rgba(255,255,255,.9);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .05em;
      opacity: 0;
      pointer-events: none;
      transition: opacity .1s;
    }
    .drag-label.nope { left: 24px; color: var(--rose-dark); transform: rotate(-7deg); }
    .drag-label.yep { right: 24px; color: var(--green-dark); transform: rotate(7deg); }

    .actions { justify-content: center; margin-top: 22px; }
    .choice {
      width: min(230px, 44%);
      min-height: 56px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 850;
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .choice:hover { transform: translateY(-2px); }
    .choice.no { background: var(--rose); color: #682c38; box-shadow: 0 7px 18px rgba(147,66,81,.13); }
    .choice.yes { background: var(--green); color: #225b38; box-shadow: 0 7px 18px rgba(44,107,66,.13); }

    .instructions { margin: 18px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
    .complete { display: none; min-height: 440px; place-items: center; padding: 30px; text-align: center; }
    .complete.show { display: grid; }
    .complete h2 { margin: 0 0 10px; font-size: clamp(30px, 6vw, 48px); }
    .complete p { max-width: 530px; margin: 0 auto 22px; color: var(--muted); line-height: 1.55; }
    .restart { background: var(--blue); color: #174d77; border-color: transparent; }

    @media (max-width: 650px) {
      .page { width: min(100% - 20px, 980px); padding-top: 20px; }
      header { display: block; margin-left: 6px; }
      .header-links { justify-content: flex-start; margin-top: 12px; }
      .study-shell { border-radius: 22px; }
      .toolbar { align-items: flex-start; }
      .stats { gap: 6px; }
      .pill { padding: 6px 9px; font-size: 12px; }
      .icon-button { padding-inline: 10px; }
      .card-stage { height: 390px; }
      .actions { gap: 9px; }
      .instructions { line-height: 1.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">Web development · Study set</p>
        <h1>HTML Tag Flashcards</h1>
        <p class="subtitle">Flip the card, then sort it. Your progress stays saved on this device.</p>
      </div>
      <nav class="header-links" aria-label="Learning tools">
        <a class="tree-link primary" href="coding-exercises.html">Coding lab →</a>
        <a class="tree-link" href="spanish-verb-family-tree.html">Spanish verb tree</a>
      </nav>
    </header>

    <section class="study-shell" aria-label="HTML tag flashcard study set">
      <div id="studyView">
        <div class="toolbar">
          <div class="stats" aria-live="polite">
            <span class="pill"><b id="remainingCount">40</b> remaining</span>
            <span class="pill know"><b id="knowCount">0</b> know</span>
            <span class="pill learning"><b id="learningCount">0</b> learning</span>
          </div>
          <button class="icon-button" id="shuffleButton" type="button">Shuffle</button>
        </div>

        <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

        <div class="card-stage" id="cardStage">
          <span class="drag-label nope" id="noLabel">LEARNING</span>
          <span class="drag-label yep" id="yesLabel">KNOW</span>
          <button class="flashcard" id="flashcard" type="button" aria-label="Flashcard. Tap to reveal answer." aria-pressed="false">
            <span class="face front">
              <span class="side-label">HTML tag</span>
              <span class="term" id="term"></span>
              <span class="tap-hint">Tap to flip</span>
            </span>
            <span class="face back">
              <span class="side-label">Meaning</span>
              <span class="definition" id="definition"></span>
              <span class="example" id="example"></span>
              <span class="tap-hint">Tap to see the tag</span>
            </span>
          </button>
        </div>

        <div class="actions">
          <button class="choice no" id="dontKnowButton" type="button">← Don’t know</button>
          <button class="choice yes" id="knowButton" type="button">Know →</button>
        </div>
        <p class="instructions">Swipe left or right · Use ← / → to sort · Spacebar flips the card</p>
      </div>

      <div class="complete" id="completeView">
        <div>
          <p class="eyebrow">Round complete</p>
          <h2 id="completeTitle">Nice work.</h2>
          <p id="completeMessage"></p>
          <button class="icon-button restart" id="restartButton" type="button">Study the learning pile again</button>
          <button class="icon-button" id="resetButton" type="button">Reset all progress</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const cards = [
      { term: "<html>", definition: "Contains the entire HTML document.", example: "<html> ... </html>" },
      { term: "<head>", definition: "Holds information about the page that is not its main visible content.", example: "<head><title>My Page</title></head>" },
      { term: "<body>", definition: "Contains the webpage content visitors can see.", example: "<body><h1>Hello!</h1></body>" },
      { term: "<title>", definition: "Sets the text shown in the browser tab.", example: "<title>My Website</title>" },
      { term: "<h1>", definition: "Creates the page’s main, most important heading.", example: "<h1>My Website</h1>" },
      { term: "<h2>", definition: "Creates a second-level heading beneath an h1.", example: "<h2>About Me</h2>" },
      { term: "<h3>", definition: "Creates a third-level heading.", example: "<h3>My Hobbies</h3>" },
      { term: "<p>", definition: "Creates a paragraph of text.", example: "<p>I am learning HTML.</p>" },
      { term: "<br>", definition: "Inserts a single line break. It is a void element.", example: "First line<br>Second line" },
      { term: "<hr>", definition: "Marks a thematic break, usually shown as a horizontal line.", example: "<p>Part one</p><hr><p>Part two</p>" },
      { term: "<a>", definition: "Creates a hyperlink to another page or location.", example: "<a href=\"https://example.com\">Visit</a>" },
      { term: "<img>", definition: "Displays an image. The alt attribute describes it.", example: "<img src=\"cat.jpg\" alt=\"A cat\">" },
      { term: "<button>", definition: "Creates a clickable button.", example: "<button>Click me</button>" },
      { term: "<div>", definition: "A generic block container used to group elements.", example: "<div><p>Grouped content</p></div>" },
      { term: "<span>", definition: "A generic inline container, often used to style part of text.", example: "<p>Hello <span>friend</span>.</p>" },
      { term: "<strong>", definition: "Marks text as strongly important; browsers normally show it in bold.", example: "<strong>Warning!</strong>" },
      { term: "<em>", definition: "Marks emphasized text; browsers normally show it in italics.", example: "I <em>really</em> mean it." },
      { term: "<ul>", definition: "Creates an unordered, usually bulleted list.", example: "<ul><li>Tea</li><li>Coffee</li></ul>" },
      { term: "<ol>", definition: "Creates an ordered, usually numbered list.", example: "<ol><li>First</li><li>Second</li></ol>" },
      { term: "<li>", definition: "Creates one item inside a ul or ol list.", example: "<li>One list item</li>" },
      { term: "<table>", definition: "Creates a table for row-and-column data.", example: "<table> ... rows ... </table>" },
      { term: "<tr>", definition: "Creates one row inside a table.", example: "<tr><td>Cell</td></tr>" },
      { term: "<th>", definition: "Creates a header cell inside a table row.", example: "<th>Name</th>" },
      { term: "<td>", definition: "Creates a standard data cell inside a table row.", example: "<td>Iyana</td>" },
      { term: "<form>", definition: "Groups controls that collect and submit user information.", example: "<form><input><button>Send</button></form>" },
      { term: "<input>", definition: "Creates an input control such as a text box, checkbox, or date picker.", example: "<input type=\"text\" name=\"firstName\">" },
      { term: "<label>", definition: "Gives a form control an accessible text label.", example: "<label for=\"email\">Email</label>" },
      { term: "<textarea>", definition: "Creates a multi-line text input.", example: "<textarea name=\"message\"></textarea>" },
      { term: "<select>", definition: "Creates a drop-down selection control.", example: "<select><option>Red</option></select>" },
      { term: "<option>", definition: "Defines one choice inside a select element.", example: "<option value=\"blue\">Blue</option>" },
      { term: "<header>", definition: "Represents introductory content for a page or section.", example: "<header><h1>Site name</h1></header>" },
      { term: "<nav>", definition: "Represents a section of navigation links.", example: "<nav><a href=\"/about\">About</a></nav>" },
      { term: "<main>", definition: "Contains the page’s unique main content.", example: "<main><article>...</article></main>" },
      { term: "<section>", definition: "Groups a thematic section of related content.", example: "<section><h2>News</h2></section>" },
      { term: "<article>", definition: "Represents a self-contained piece of content.", example: "<article><h2>Post title</h2></article>" },
      { term: "<footer>", definition: "Represents footer information for a page or section.", example: "<footer>Copyright 2026</footer>" },
      { term: "<script>", definition: "Contains JavaScript or loads it from another file.", example: "<script src=\"app.js\"><" + "/script>" },
      { term: "<style>", definition: "Contains CSS written directly inside an HTML document.", example: "<style>p { color: blue; }</style>" },
      { term: "<link>", definition: "Connects an external resource, commonly a CSS stylesheet.", example: "<link rel=\"stylesheet\" href=\"style.css\">" },
      { term: "<meta>", definition: "Provides metadata such as character encoding or viewport settings.", example: "<meta charset=\"UTF-8\">" }
    ];

    const storageKey = "html-tag-flashcards-v1";
    const flashcard = document.querySelector("#flashcard");
    const cardStage = document.querySelector("#cardStage");
    const term = document.querySelector("#term");
    const definition = document.querySelector("#definition");
    const example = document.querySelector("#example");
    const remainingCount = document.querySelector("#remainingCount");
    const knowCount = document.querySelector("#knowCount");
    const learningCount = document.querySelector("#learningCount");
    const progressBar = document.querySelector("#progressBar");
    const studyView = document.querySelector("#studyView");
    const completeView = document.querySelector("#completeView");
    const completeTitle = document.querySelector("#completeTitle");
    const completeMessage = document.querySelector("#completeMessage");
    const restartButton = document.querySelector("#restartButton");
    const noLabel = document.querySelector("#noLabel");
    const yesLabel = document.querySelector("#yesLabel");

    let saved = JSON.parse(localStorage.getItem(storageKey) || "null") || { known: [], learning: [] };
    let queue = cards.map((_, index) => index).filter(index => !saved.known.includes(index) && !saved.learning.includes(index));
    let roundTotal = queue.length;
    let flipped = false;
    let sorting = false;
    let dragStart = null;

    if (!queue.length) queue = saved.learning.length ? [...saved.learning] : cards.map((_, index) => index);
    roundTotal = queue.length;

    function save() { localStorage.setItem(storageKey, JSON.stringify(saved)); }

    function render() {
      if (!queue.length) return finishRound();
      const card = cards[queue[0]];
      term.textContent = card.term;
      definition.textContent = card.definition;
      example.textContent = card.example;
      remainingCount.textContent = queue.length;
      knowCount.textContent = saved.known.length;
      learningCount.textContent = saved.learning.length;
      progressBar.style.width = `${((roundTotal - queue.length) / Math.max(roundTotal, 1)) * 100}%`;
      flipped = false;
      flashcard.className = "flashcard";
      flashcard.style.transform = "";
      flashcard.style.opacity = "";
      flashcard.setAttribute("aria-pressed", "false");
      flashcard.setAttribute("aria-label", `Flashcard: ${card.term}. Tap to reveal answer.`);
      sorting = false;
    }

    function flip() {
      if (sorting) return;
      flipped = !flipped;
      flashcard.classList.toggle("is-flipped", flipped);
      flashcard.setAttribute("aria-pressed", String(flipped));
      flashcard.setAttribute("aria-label", flipped ? `${cards[queue[0]].definition} Tap to see the tag.` : `Flashcard: ${cards[queue[0]].term}. Tap to reveal answer.`);
    }

    function sortCard(knowsIt) {
      if (sorting || !queue.length) return;
      sorting = true;
      const index = queue.shift();
      saved.known = saved.known.filter(item => item !== index);
      saved.learning = saved.learning.filter(item => item !== index);
      (knowsIt ? saved.known : saved.learning).push(index);
      save();
      flashcard.classList.add(knowsIt ? "exit-right" : "exit-left");
      window.setTimeout(render, 300);
    }

    function finishRound() {
      progressBar.style.width = "100%";
      studyView.style.display = "none";
      completeView.classList.add("show");
      const allKnown = saved.known.length === cards.length;
      completeTitle.textContent = allKnown ? "You know the whole deck." : "Round complete.";
      completeMessage.textContent = allKnown
        ? `All ${cards.length} HTML tags are in your Know pile.`
        : `You know ${saved.known.length} tags. ${saved.learning.length} are waiting in your learning pile.`;
      restartButton.style.display = saved.learning.length ? "inline-block" : "none";
    }

    function startQueue(indices) {
      queue = [...indices];
      roundTotal = queue.length;
      studyView.style.display = "block";
      completeView.classList.remove("show");
      render();
    }

    function shuffle() {
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
      render();
    }

    flashcard.addEventListener("click", flip);
    document.querySelector("#dontKnowButton").addEventListener("click", () => sortCard(false));
    document.querySelector("#knowButton").addEventListener("click", () => sortCard(true));
    document.querySelector("#shuffleButton").addEventListener("click", shuffle);
    restartButton.addEventListener("click", () => startQueue(saved.learning));
    document.querySelector("#resetButton").addEventListener("click", () => {
      saved = { known: [], learning: [] };
      save();
      startQueue(cards.map((_, index) => index));
    });

    flashcard.addEventListener("pointerdown", event => {
      if (sorting) return;
      dragStart = { x: event.clientX, y: event.clientY };
      flashcard.setPointerCapture(event.pointerId);
      flashcard.classList.add("dragging");
    });

    flashcard.addEventListener("pointermove", event => {
      if (!dragStart) return;
      const x = event.clientX - dragStart.x;
      const y = event.clientY - dragStart.y;
      if (Math.abs(y) > Math.abs(x) && Math.abs(y) > 12) return;
      const rotation = x / 35;
      const flipTransform = flipped ? " rotateY(180deg)" : "";
      flashcard.style.transform = `translateX(${x}px) rotate(${rotation}deg)${flipTransform}`;
      noLabel.style.opacity = String(Math.min(Math.max(-x / 110, 0), 1));
      yesLabel.style.opacity = String(Math.min(Math.max(x / 110, 0), 1));
    });

    function endDrag(event) {
      if (!dragStart) return;
      const distance = event.clientX - dragStart.x;
      dragStart = null;
      flashcard.classList.remove("dragging");
      noLabel.style.opacity = "0";
      yesLabel.style.opacity = "0";
      if (Math.abs(distance) > Math.min(120, cardStage.clientWidth * .22)) {
        flashcard.style.transform = "";
        sortCard(distance > 0);
      } else {
        flashcard.style.transform = "";
      }
    }

    flashcard.addEventListener("pointerup", endDrag);
    flashcard.addEventListener("pointercancel", () => {
      dragStart = null;
      flashcard.classList.remove("dragging");
      flashcard.style.transform = "";
      noLabel.style.opacity = "0";
      yesLabel.style.opacity = "0";
    });

    document.addEventListener("keydown", event => {
      if (event.target.matches("button") && (event.key === "Enter" || event.key === " ")) return;
      if (event.key === "ArrowLeft") sortCard(false);
      if (event.key === "ArrowRight") sortCard(true);
      if (event.key === " ") { event.preventDefault(); flip(); }
    });

    render();
  </script>
</body>
</html>
